name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - http
          - openapi
      version:
        description: "Version to publish (e.g., 0.2.0)"
        required: true
        type: string
      publish-npm:
        description: "Publish to npm"
        required: false
        type: boolean
        default: true
      dry-run:
        description: "Run in dry-run mode (no actual publish)"
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install Vite+
        run: npm install -g vite-plus@latest

      - name: Install dependencies
        run: vp install

      - name: Check (fmt + lint + typecheck)
        run: vp check

      - name: Run tests
        run: vp run test -r

  publish:
    name: Publish
    needs: test
    if: inputs.dry-run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install Vite+
        run: npm install -g vite-plus@latest

      - name: Install dependencies
        run: vp install

      - name: Update package.json version
        working-directory: ./packages/${{ inputs.package }}
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Build package
        working-directory: ./packages/${{ inputs.package }}
        run: vp pack

      - name: Publish to npm
        if: inputs.publish-npm == true
        working-directory: ./packages/${{ inputs.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add packages/${{ inputs.package }}/package.json
          git commit -m "chore(${{ inputs.package }}): bump version to ${{ inputs.version }}"
          git push

      - name: Create Git Tag
        run: |
          git tag "${{ inputs.package }}/v${{ inputs.version }}"
          git push origin "${{ inputs.package }}/v${{ inputs.version }}"

  dry-run:
    name: Dry Run
    needs: test
    if: inputs.dry-run == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install Vite+
        run: npm install -g vite-plus@latest

      - name: Install dependencies
        run: vp install

      - name: Update package.json version
        working-directory: ./packages/${{ inputs.package }}
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Build package
        working-directory: ./packages/${{ inputs.package }}
        run: vp pack

      - name: Dry run npm publish
        if: inputs.publish-npm == true
        working-directory: ./packages/${{ inputs.package }}
        run: |
          echo "Would publish @hectoday/${{ inputs.package }}@${{ inputs.version }} to npm"
          npm publish --dry-run --access public
